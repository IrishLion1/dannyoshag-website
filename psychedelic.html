/*
    Psychedelic mode v8 — Color Chaos
    ----------------------------------
    Goal: lots of color, simple automatic movement, low mobile cost.

    Performance strategy:
    - One low-resolution canvas background, capped around 24 fps
    - No giant blur filters
    - No mouse or hover interaction
    - Foreground photo effects use lightweight gradient overlays
    - Every photo has different durations and delays
*/

html {
    background: #050008;
}

body.psychedelic-mode {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    background: transparent;
}

#color-field {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -20;
    pointer-events: none;
}

.psychedelic-mode::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -15;
    pointer-events: none;
    opacity: 0.44;
    background:
        radial-gradient(circle at 18% 22%, rgba(255, 0, 170, .62), transparent 38%),
        radial-gradient(circle at 78% 28%, rgba(0, 225, 255, .54), transparent 40%),
        radial-gradient(circle at 50% 82%, rgba(173, 255, 0, .34), transparent 46%);
    mix-blend-mode: screen;
    animation: page-color-breathe 12s ease-in-out infinite alternate;
}

.psychedelic-mode::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    opacity: .08;
    background:
        linear-gradient(rgba(255,255,255,.06) 50%, transparent 50%);
    background-size: 100% 4px;
}

.psychedelic-mode > header,
.psychedelic-mode > main,
.psychedelic-mode > .psy-badge {
    position: relative;
    z-index: 5;
}

.psychedelic-mode header,
.psychedelic-mode .contact {
    text-shadow:
        0 2px 14px rgba(0,0,0,.88),
        0 0 20px rgba(255,0,190,.16);
}

.psychedelic-mode header h1 {
    color: white;
    text-shadow:
        3px 0 0 rgba(0,225,255,.40),
        -3px 0 0 rgba(255,0,190,.40),
        0 2px 16px rgba(0,0,0,.82);
}

.psy-frame {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    width: 100%;
    line-height: 0;
    background: #09000f;
}

.psy-frame img {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: auto;
    filter: saturate(118%) contrast(106%);
}

/* Main color wash over each photograph. */
.psy-frame::before {
    content: "";
    position: absolute;
    inset: -2px;
    z-index: 2;
    pointer-events: none;
    opacity: var(--wash-opacity, .62);
    mix-blend-mode: color;
    background:
        linear-gradient(
            var(--wash-angle, 45deg),
            #ff0099 0%,
            #7b2cff 22%,
            #00d9ff 45%,
            #b7ff00 68%,
            #ff7a00 84%,
            #ff0099 100%
        );
    background-size: 320% 320%;
    animation:
        color-wash var(--wash-time, 11s) linear infinite,
        wash-pulse var(--pulse-time, 7s) ease-in-out infinite alternate;
    animation-delay:
        var(--wash-delay, 0s),
        var(--pulse-delay, 0s);
}

/* Moving X / quadrant effect. */
.psy-frame::after {
    content: "";
    position: absolute;
    inset: -35%;
    z-index: 3;
    pointer-events: none;
    opacity: var(--x-opacity, .44);
    mix-blend-mode: screen;
    background:
        linear-gradient(
            45deg,
            rgba(255,0,180,.85) 0 16%,
            transparent 16% 40%,
            rgba(0,225,255,.74) 40% 57%,
            transparent 57% 82%,
            rgba(190,255,0,.65) 82% 100%
        ),
        linear-gradient(
            -45deg,
            rgba(115,30,255,.72) 0 15%,
            transparent 15% 42%,
            rgba(255,125,0,.68) 42% 59%,
            transparent 59% 84%,
            rgba(0,230,255,.64) 84% 100%
        );
    background-size: 210% 210%;
    animation:
        x-chaos var(--x-time, 17s) linear infinite,
        x-turn var(--turn-time, 29s) ease-in-out infinite alternate;
    animation-delay:
        var(--x-delay, 0s),
        var(--turn-delay, 0s);
}

/* Intentionally mismatched timings. */
.hero-pair .psy-frame:nth-child(1) {
    --wash-time: 9.5s;
    --pulse-time: 6.3s;
    --x-time: 16s;
    --turn-time: 31s;
    --wash-delay: -2s;
    --pulse-delay: -4s;
    --x-delay: -7s;
    --turn-delay: -9s;
    --wash-angle: 28deg;
    --wash-opacity: .57;
    --x-opacity: .40;
}

.hero-pair .psy-frame:nth-child(2) {
    --wash-time: 14.2s;
    --pulse-time: 8.9s;
    --x-time: 21s;
    --turn-time: 24s;
    --wash-delay: -10s;
    --pulse-delay: -1s;
    --x-delay: -3s;
    --turn-delay: -14s;
    --wash-angle: 118deg;
    --wash-opacity: .65;
    --x-opacity: .50;
}

.gallery-row .psy-frame:nth-child(1) {
    --wash-time: 7.7s;
    --pulse-time: 10.2s;
    --x-time: 13.6s;
    --turn-time: 33s;
    --wash-delay: -4s;
    --pulse-delay: -8s;
    --x-delay: -9s;
    --turn-delay: -2s;
    --wash-angle: 72deg;
    --wash-opacity: .54;
    --x-opacity: .38;
}

.gallery-row .psy-frame:nth-child(2) {
    --wash-time: 18.4s;
    --pulse-time: 5.8s;
    --x-time: 25s;
    --turn-time: 19s;
    --wash-delay: -13s;
    --pulse-delay: -3s;
    --x-delay: -16s;
    --turn-delay: -7s;
    --wash-angle: 162deg;
    --wash-opacity: .68;
    --x-opacity: .48;
}

.gallery-row .psy-frame:nth-child(3) {
    --wash-time: 11.3s;
    --pulse-time: 12.6s;
    --x-time: 18.8s;
    --turn-time: 37s;
    --wash-delay: -1s;
    --pulse-delay: -11s;
    --x-delay: -5s;
    --turn-delay: -20s;
    --wash-angle: 206deg;
    --wash-opacity: .60;
    --x-opacity: .43;
}

.gallery-row .psy-frame:nth-child(4) {
    --wash-time: 15.8s;
    --pulse-time: 7.4s;
    --x-time: 29s;
    --turn-time: 23s;
    --wash-delay: -8s;
    --pulse-delay: -5s;
    --x-delay: -21s;
    --turn-delay: -4s;
    --wash-angle: 315deg;
    --wash-opacity: .64;
    --x-opacity: .46;
}

.psy-badge {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 9999;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.48);
    border-radius: 999px;
    background: rgba(11, 5, 20, 0.78);
    color: #ffffff;
    font: 700 12px/1 Arial, sans-serif;
    letter-spacing: 0.06em;
    text-decoration: none;
}

@keyframes page-color-breathe {
    0% {
        opacity: .28;
        transform: scale(1);
        filter: hue-rotate(0deg);
    }
    100% {
        opacity: .62;
        transform: scale(1.12);
        filter: hue-rotate(95deg);
    }
}

@keyframes color-wash {
    0% {
        background-position: 0% 20%;
        transform: scale(1.04);
    }
    100% {
        background-position: 300% 80%;
        transform: scale(1.12);
    }
}

@keyframes wash-pulse {
    0% {
        opacity: calc(var(--wash-opacity, .62) * .62);
    }
    100% {
        opacity: var(--wash-opacity, .62);
    }
}

@keyframes x-chaos {
    0% {
        background-position: 0% 0%, 100% 0%;
    }
    100% {
        background-position: 210% 190%, -120% 180%;
    }
}

@keyframes x-turn {
    0% {
        transform: rotate(-8deg) scale(1.06);
    }
    100% {
        transform: rotate(18deg) scale(1.22);
    }
}

@media (max-width: 800px) {
    .psy-frame::before {
        opacity: calc(var(--wash-opacity, .62) * .90);
    }

    .psy-frame::after {
        opacity: calc(var(--x-opacity, .44) * .88);
    }
}

@media (prefers-reduced-motion: reduce) {
    #color-field {
        display: none;
    }

    .psychedelic-mode::before,
    .psy-frame::before,
    .psy-frame::after {
        animation: none !important;
    }
}


/*
    v9 — Wonky non-monotonic color curves
    --------------------------------------
    These are real per-channel transfer curves implemented as SVG filters.
    Each channel intentionally rises, dips, and rises again, similar in spirit
    to drawing a non-monotonic curve in a photo editor.

    The filters are static to keep mobile performance reasonable.
    Existing automatic overlays and background movement continue independently.
*/

.psychedelic-mode img.curve-acid {
    filter: url("#curve-acid");
}

.psychedelic-mode img.curve-solar {
    filter: url("#curve-solar");
}

.psychedelic-mode img.curve-crushed {
    filter: url("#curve-crushed");
}

.psychedelic-mode img.curve-inverted-midtones {
    filter: url("#curve-inverted-midtones");
}

/* Push the moving color layers harder without adding new compositing layers. */
.psy-frame::before {
    opacity: min(0.88, calc(var(--wash-opacity, .62) + .16));
    mix-blend-mode: hard-light;
    background:
        linear-gradient(
            var(--wash-angle, 45deg),
            #ff00bb 0%,
            #6a00ff 14%,
            #00eaff 31%,
            #00ff6a 48%,
            #eaff00 64%,
            #ff6a00 80%,
            #ff0055 100%
        );
    background-size: 360% 360%;
}

.psy-frame::after {
    opacity: min(0.78, calc(var(--x-opacity, .44) + .18));
    mix-blend-mode: difference;
    background:
        linear-gradient(
            45deg,
            rgba(255,0,190,.98) 0 14%,
            transparent 14% 33%,
            rgba(0,255,255,.92) 33% 52%,
            transparent 52% 72%,
            rgba(205,255,0,.88) 72% 100%
        ),
        linear-gradient(
            -45deg,
            rgba(115,0,255,.96) 0 13%,
            transparent 13% 35%,
            rgba(255,115,0,.90) 35% 57%,
            transparent 57% 78%,
            rgba(0,255,180,.84) 78% 100%
        );
}

/* Faster but still mismatched automatic cycles. */
.hero-pair .psy-frame:nth-child(1) {
    --wash-time: 6.8s;
    --pulse-time: 4.7s;
    --x-time: 10.2s;
    --turn-time: 18s;
}

.hero-pair .psy-frame:nth-child(2) {
    --wash-time: 9.6s;
    --pulse-time: 6.1s;
    --x-time: 14.4s;
    --turn-time: 21s;
}

.gallery-row .psy-frame:nth-child(1) {
    --wash-time: 5.9s;
    --pulse-time: 7.3s;
    --x-time: 8.8s;
    --turn-time: 24s;
}

.gallery-row .psy-frame:nth-child(2) {
    --wash-time: 12.8s;
    --pulse-time: 4.2s;
    --x-time: 16.6s;
    --turn-time: 15s;
}

.gallery-row .psy-frame:nth-child(3) {
    --wash-time: 8.1s;
    --pulse-time: 9.4s;
    --x-time: 12.1s;
    --turn-time: 27s;
}

.gallery-row .psy-frame:nth-child(4) {
    --wash-time: 10.7s;
    --pulse-time: 5.3s;
    --x-time: 18.2s;
    --turn-time: 17s;
}

/* Slightly quicker global color field. */
.psychedelic-mode::before {
    animation-duration: 8.5s;
}

@media (max-width: 800px) {
    /*
        Keep the SVG curves, but slightly lower overlay strength in small
        in-app browsers to reduce muddy clipping.
    */
    .psy-frame::before {
        opacity: min(0.78, calc(var(--wash-opacity, .62) + .10));
    }

    .psy-frame::after {
        opacity: min(0.68, calc(var(--x-opacity, .44) + .12));
    }
}


/*
    v10 — Warped photo backgrounds + unique per-image motion
    ---------------------------------------------------------
    Performance goals:
    - Remove canvas dependency from the visual experience
    - Reuse existing images as CSS backgrounds
    - Animate transforms and opacity only
    - Keep all motion automatic
*/

/* Hide the old canvas background; the warped photo layers replace it. */
#color-field {
    display: none;
}

/* Tone down the old generic background wash. */
.psychedelic-mode::before {
    opacity: .16;
    animation-duration: 18s;
}

/* Warped photo texture background */
.photo-backgrounds {
    position: fixed;
    inset: 0;
    z-index: -20;
    overflow: hidden;
    pointer-events: none;
    background: #050008;
}

.photo-bg {
    position: absolute;
    width: 72vmax;
    aspect-ratio: 4 / 5;
    background-size: cover;
    background-position: center;
    opacity: .17;
    mix-blend-mode: screen;
    filter: saturate(210%) contrast(115%) hue-rotate(var(--bg-hue, 0deg));
    transform-origin: center;
    will-change: transform, opacity, filter;
}

.photo-bg-1 {
    left: -27vmax;
    top: -14vmax;
    background-image: url("images/photo-1.jpg");
    animation:
        bg-drift-1 34s ease-in-out infinite alternate,
        bg-hue-1 21s linear infinite,
        bg-pulse-1 11s ease-in-out infinite;
}

.photo-bg-2 {
    right: -30vmax;
    top: -5vmax;
    background-image: url("images/photo-2.jpg");
    opacity: .12;
    animation:
        bg-drift-2 41s ease-in-out infinite alternate-reverse,
        bg-hue-2 29s linear infinite reverse,
        bg-pulse-2 14s ease-in-out infinite;
    animation-delay: -9s, -5s, -2s;
}

.photo-bg-3 {
    left: 12vw;
    top: 32vh;
    background-image: url("images/photo-3.jpg");
    width: 58vmax;
    opacity: .15;
    animation:
        bg-drift-3 37s ease-in-out infinite alternate,
        bg-hue-3 25s linear infinite,
        bg-pulse-3 17s ease-in-out infinite;
    animation-delay: -13s, -11s, -6s;
}

.photo-bg-4 {
    right: -18vmax;
    top: 40vh;
    background-image: url("images/photo-4.jpg");
    width: 62vmax;
    opacity: .14;
    animation:
        bg-drift-4 46s ease-in-out infinite alternate-reverse,

    animation-delay: -17s, -7s, -9s;
}

.photo-bg-5 {
    left: -18vmax;
    bottom: -34vmax;
    background-image: url("images/photo-5.jpg");

    opacity: .16;
    animation:
        bg-drift-5 43s ease-in-out infinite alternate,

.photo-bg-6 {

    animation:
        bg-drift-6 39s ease-in-out infinite alternate-reverse,

        bg-pulse-6 15s ease-in-out infinite;
    animation-delay: -5s, -19s, -12s;
}

/* RGB bleed using lightweight drop-shadows, different per image. */
.psy-frame img {
    transition: none;
}

.pattern-rings img {
    filter: url("#curve-acid") drop-shadow(10px 0 0 rgba(0, 235, 255, .28))
            drop-shadow(-10px 0 0 rgba(255, 0, 190, .24));
}

.pattern-waves img {
    filter: url("#curve-solar") drop-shadow(6px 0 0 rgba(0, 235, 255, .18))
            drop-shadow(-6px 0 0 rgba(255, 0, 190, .16));
}

.pattern-prisms img {
    filter: url("#curve-crushed") drop-shadow(12px 0 0 rgba(255, 0, 190, .28))
            drop-shadow(-8px 0 0 rgba(180, 255, 0, .20));
}

.pattern-kaleidoscope img {
    filter: url("#curve-inverted-midtones") drop-shadow(8px 0 0 rgba(0, 255, 220, .24))
            drop-shadow(-12px 0 0 rgba(255, 120, 0, .24));
}

.pattern-spiral img {
    filter: url("#curve-solar") drop-shadow(9px 0 0 rgba(120, 0, 255, .25))
            drop-shadow(-9px 0 0 rgba(0, 240, 255, .22));
}

.pattern-blobs img {
    filter: url("#curve-acid") drop-shadow(10px 0 0 rgba(255, 0, 110, .24))
            drop-shadow(-10px 0 0 rgba(180, 255, 0, .20));
}

/* Image 2 toned down so the subject remains readable. */
.pattern-waves::before {
    opacity: .42 !important;
    mix-blend-mode: color !important;
}

.pattern-waves::after {
    opacity: .25 !important;
    mix-blend-mode: screen !important;
}

.pattern-waves img {
    opacity: .98;
}

/* Distinct overlay personalities */
.pattern-rings::after {
    inset: -20%;
    opacity: .48;
    mix-blend-mode: screen;
    background:
        repeating-radial-gradient(
            circle at 50% 50%,
            rgba(255,0,190,.78) 0 3%,
            transparent 3% 8%,
            rgba(0,235,255,.62) 8% 11%,
            transparent 11% 17%
        );
    animation:
        rings-spin 18s linear infinite,
        rings-pulse 7s ease-in-out infinite alternate;
}

.pattern-waves::after {
    inset: -20%;
    background:
        repeating-linear-gradient(
            18deg,
            rgba(0,235,255,.42) 0 5%,
            transparent 5% 11%,
            rgba(255,0,190,.34) 11% 16%,
            transparent 16% 23%
        );
    animation:
        waves-slide 14s linear infinite,
        waves-shear 9s ease-in-out infinite alternate;
}

.pattern-prisms::after {
    inset: -28%;
    opacity: .50;
    mix-blend-mode: difference;
    background:
        conic-gradient(
            from 0deg,
            rgba(255,0,190,.88),
            rgba(0,235,255,.78),
            rgba(190,255,0,.72),
            rgba(255,120,0,.78),
            rgba(120,0,255,.82),
            rgba(255,0,190,.88)
        );
    animation:
        prism-spin 22s linear infinite reverse,
        prism-scale 8s ease-in-out infinite alternate;
}

.pattern-kaleidoscope::after {
    inset: -34%;
    opacity: .44;
    mix-blend-mode: hard-light;
    background:
        repeating-conic-gradient(
            from 12deg,
            rgba(255,0,190,.74) 0 12deg,

            rgba(0,235,255,.66) 28deg 40deg,
            transparent 40deg 58deg
        );

        kaleido-spin 28s linear infinite,
        kaleido-breathe 10s ease-in-out infinite alternate;
}

.pattern-spiral::after {
    inset: -30%;
    opacity: .43;
    mix-blend-mode: screen;
    background:
        repeating-radial-gradient(
            ellipse at center,
            rgba(120,0,255,.70) 0 4%,
            transparent 4% 9%,
            rgba(0,235,255,.60) 9% 13%,
            transparent 13% 20%
        );
    animation:
        spiral-warp 19s ease-in-out infinite alternate,
        spiral-spin 25s linear infinite;
}

.pattern-blobs::after {
    inset: -20%;
    opacity: .46;
    mix-blend-mode: color-dodge;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,0,190,.82), transparent 28%),
        radial-gradient(circle at 72% 22%, rgba(0,235,255,.76), transparent 31%),
        radial-gradient(circle at 52% 78%, rgba(190,255,0,.68), transparent 30%),
        radial-gradient(circle at 85% 70%, rgba(255,120,0,.68), transparent 29%);
    animation:
        blobs-wander 17s ease-in-out infinite alternate,
        blobs-color 13s linear infinite;
}

/* Background warp motion */
@keyframes bg-drift-1 {
    0%   { transform: translate3d(-6vw,-4vh,0) rotate(-18deg) scaleX(1.5) scaleY(.72); }
    100% { transform: translate3d(35vw,28vh,0) rotate(21deg) scaleX(.78) scaleY(1.48); }
}
@keyframes bg-drift-2 {
    0%   { transform: translate3d(8vw,-6vh,0) rotate(16deg) scaleX(.82) scaleY(1.55); }
    100% { transform: translate3d(-38vw,36vh,0) rotate(-24deg) scaleX(1.62) scaleY(.66); }
}
@keyframes bg-drift-3 {
    0%   { transform: translate3d(-12vw,2vh,0) rotate(-10deg) scaleX(1.3) scaleY(.86); }
    100% { transform: translate3d(27vw,-22vh,0) rotate(28deg) scaleX(.75) scaleY(1.42); }
}
