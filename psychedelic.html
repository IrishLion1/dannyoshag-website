/*
    Psychedelic mode v8 — Color Chaos
    ----------------------------------
    Goal: lots of color, simple automatic movement, low mobile cost.

    Performance strategy:
    - One low-resolution canvas background, capped around 24 fps
    - No giant blur filters
    - No mouse or hover interaction
    - Foreground photo effects use lightweight gradient overlays
    - Every photo has different durations and delays
*/

html {
    background: #050008;
}

body.psychedelic-mode {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    background: transparent;
}

#color-field {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -20;
    pointer-events: none;
}

.psychedelic-mode::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -15;
    pointer-events: none;
    opacity: 0.44;
    background:
        radial-gradient(circle at 18% 22%, rgba(255, 0, 170, .62), transparent 38%),
        radial-gradient(circle at 78% 28%, rgba(0, 225, 255, .54), transparent 40%),
        radial-gradient(circle at 50% 82%, rgba(173, 255, 0, .34), transparent 46%);
    mix-blend-mode: screen;
    animation: page-color-breathe 12s ease-in-out infinite alternate;
}

.psychedelic-mode::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    opacity: .08;
    background:
        linear-gradient(rgba(255,255,255,.06) 50%, transparent 50%);
    background-size: 100% 4px;
}

.psychedelic-mode > header,
.psychedelic-mode > main,
.psychedelic-mode > .psy-badge {
    position: relative;
    z-index: 5;
}

.psychedelic-mode header,
.psychedelic-mode .contact {
    text-shadow:
        0 2px 14px rgba(0,0,0,.88),
        0 0 20px rgba(255,0,190,.16);
}

.psychedelic-mode header h1 {
    color: white;
    text-shadow:
        3px 0 0 rgba(0,225,255,.40),
        -3px 0 0 rgba(255,0,190,.40),
        0 2px 16px rgba(0,0,0,.82);
}

.psy-frame {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    width: 100%;
    line-height: 0;
    background: #09000f;
}

.psy-frame img {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    height: auto;
    filter: saturate(118%) contrast(106%);
}

/* Main color wash over each photograph. */
.psy-frame::before {
    content: "";
    position: absolute;
    inset: -2px;
    z-index: 2;
    pointer-events: none;
    opacity: var(--wash-opacity, .62);
    mix-blend-mode: color;
    background:
        linear-gradient(
            var(--wash-angle, 45deg),
            #ff0099 0%,
            #7b2cff 22%,
            #00d9ff 45%,
            #b7ff00 68%,
            #ff7a00 84%,
            #ff0099 100%
        );
    background-size: 320% 320%;
    animation:
        color-wash var(--wash-time, 11s) linear infinite,
        wash-pulse var(--pulse-time, 7s) ease-in-out infinite alternate;
    animation-delay:
        var(--wash-delay, 0s),
        var(--pulse-delay, 0s);
}

/* Moving X / quadrant effect. */
.psy-frame::after {
    content: "";
    position: absolute;
    inset: -35%;
    z-index: 3;
    pointer-events: none;
    opacity: var(--x-opacity, .44);
    mix-blend-mode: screen;
    background:
        linear-gradient(
            45deg,
            rgba(255,0,180,.85) 0 16%,
            transparent 16% 40%,
            rgba(0,225,255,.74) 40% 57%,
            transparent 57% 82%,
            rgba(190,255,0,.65) 82% 100%
        ),
        linear-gradient(
            -45deg,
            rgba(115,30,255,.72) 0 15%,
            transparent 15% 42%,
            rgba(255,125,0,.68) 42% 59%,
            transparent 59% 84%,
            rgba(0,230,255,.64) 84% 100%
        );
    background-size: 210% 210%;
    animation:
        x-chaos var(--x-time, 17s) linear infinite,
        x-turn var(--turn-time, 29s) ease-in-out infinite alternate;
    animation-delay:
        var(--x-delay, 0s),
        var(--turn-delay, 0s);
}

/* Intentionally mismatched timings. */
.hero-pair .psy-frame:nth-child(1) {
    --wash-time: 9.5s;
    --pulse-time: 6.3s;
    --x-time: 16s;
    --turn-time: 31s;
    --wash-delay: -2s;
    --pulse-delay: -4s;
    --x-delay: -7s;
    --turn-delay: -9s;
    --wash-angle: 28deg;
    --wash-opacity: .57;
    --x-opacity: .40;
}

.hero-pair .psy-frame:nth-child(2) {
    --wash-time: 14.2s;
    --pulse-time: 8.9s;
    --x-time: 21s;
    --turn-time: 24s;
    --wash-delay: -10s;
    --pulse-delay: -1s;
    --x-delay: -3s;
    --turn-delay: -14s;
    --wash-angle: 118deg;
    --wash-opacity: .65;
    --x-opacity: .50;
}

.gallery-row .psy-frame:nth-child(1) {
    --wash-time: 7.7s;
    --pulse-time: 10.2s;
    --x-time: 13.6s;
    --turn-time: 33s;
    --wash-delay: -4s;
    --pulse-delay: -8s;
    --x-delay: -9s;
    --turn-delay: -2s;
    --wash-angle: 72deg;
    --wash-opacity: .54;
    --x-opacity: .38;
}

.gallery-row .psy-frame:nth-child(2) {
    --wash-time: 18.4s;
    --pulse-time: 5.8s;
    --x-time: 25s;
    --turn-time: 19s;
    --wash-delay: -13s;
    --pulse-delay: -3s;
    --x-delay: -16s;
    --turn-delay: -7s;
    --wash-angle: 162deg;
    --wash-opacity: .68;
    --x-opacity: .48;
}

.gallery-row .psy-frame:nth-child(3) {
    --wash-time: 11.3s;
    --pulse-time: 12.6s;
    --x-time: 18.8s;
    --turn-time: 37s;
    --wash-delay: -1s;
    --pulse-delay: -11s;
    --x-delay: -5s;
    --turn-delay: -20s;
    --wash-angle: 206deg;
    --wash-opacity: .60;
    --x-opacity: .43;
}

.gallery-row .psy-frame:nth-child(4) {
    --wash-time: 15.8s;
    --pulse-time: 7.4s;
    --x-time: 29s;
    --turn-time: 23s;
    --wash-delay: -8s;
    --pulse-delay: -5s;
    --x-delay: -21s;
    --turn-delay: -4s;
    --wash-angle: 315deg;
    --wash-opacity: .64;
    --x-opacity: .46;
}

.psy-badge {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 9999;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.48);
    border-radius: 999px;
    background: rgba(11, 5, 20, 0.78);
    color: #ffffff;
    font: 700 12px/1 Arial, sans-serif;
    letter-spacing: 0.06em;
    text-decoration: none;
}

@keyframes page-color-breathe {
    0% {
        opacity: .28;
        transform: scale(1);
        filter: hue-rotate(0deg);
    }
    100% {
        opacity: .62;
        transform: scale(1.12);
        filter: hue-rotate(95deg);
    }
}

@keyframes color-wash {
    0% {
        background-position: 0% 20%;
        transform: scale(1.04);
    }
    100% {
        background-position: 300% 80%;
        transform: scale(1.12);
    }
}

@keyframes wash-pulse {
    0% {
        opacity: calc(var(--wash-opacity, .62) * .62);
    }
    100% {
        opacity: var(--wash-opacity, .62);
    }
}

@keyframes x-chaos {
    0% {
        background-position: 0% 0%, 100% 0%;
    }
    100% {
        background-position: 210% 190%, -120% 180%;
    }
}

@keyframes x-turn {
    0% {
        transform: rotate(-8deg) scale(1.06);
    }
    100% {
        transform: rotate(18deg) scale(1.22);
    }
}

@media (max-width: 800px) {
    .psy-frame::before {
        opacity: calc(var(--wash-opacity, .62) * .90);
    }

    .psy-frame::after {
        opacity: calc(var(--x-opacity, .44) * .88);
    }
}

@media (prefers-reduced-motion: reduce) {
    #color-field {
        display: none;
    }

    .psychedelic-mode::before,
    .psy-frame::before,
    .psy-frame::after {
        animation: none !important;
    }
}


/*
    v9 — Wonky non-monotonic color curves
    --------------------------------------
    These are real per-channel transfer curves implemented as SVG filters.
    Each channel intentionally rises, dips, and rises again, similar in spirit
    to drawing a non-monotonic curve in a photo editor.

    The filters are static to keep mobile performance reasonable.
    Existing automatic overlays and background movement continue independently.
*/

.psychedelic-mode img.curve-acid {
    filter: url("#curve-acid");
}

.psychedelic-mode img.curve-solar {
    filter: url("#curve-solar");
}

.psychedelic-mode img.curve-crushed {
    filter: url("#curve-crushed");
}

.psychedelic-mode img.curve-inverted-midtones {
    filter: url("#curve-inverted-midtones");
}

/* Push the moving color layers harder without adding new compositing layers. */
.psy-frame::before {
    opacity: min(0.88, calc(var(--wash-opacity, .62) + .16));
    mix-blend-mode: hard-light;
    background:
        linear-gradient(
            var(--wash-angle, 45deg),
            #ff00bb 0%,
            #6a00ff 14%,
            #00eaff 31%,
            #00ff6a 48%,
            #eaff00 64%,
            #ff6a00 80%,
            #ff0055 100%
        );
    background-size: 360% 360%;
}

.psy-frame::after {
    opacity: min(0.78, calc(var(--x-opacity, .44) + .18));
    mix-blend-mode: difference;
    background:
        linear-gradient(
            45deg,
            rgba(255,0,190,.98) 0 14%,
            transparent 14% 33%,
            rgba(0,255,255,.92) 33% 52%,
            transparent 52% 72%,
            rgba(205,255,0,.88) 72% 100%
        ),
        linear-gradient(
            -45deg,
            rgba(115,0,255,.96) 0 13%,
            transparent 13% 35%,
            rgba(255,115,0,.90) 35% 57%,
            transparent 57% 78%,
            rgba(0,255,180,.84) 78% 100%
        );
}

/* Faster but still mismatched automatic cycles. */
.hero-pair .psy-frame:nth-child(1) {
    --wash-time: 6.8s;
    --pulse-time: 4.7s;
    --x-time: 10.2s;
    --turn-time: 18s;
}

.hero-pair .psy-frame:nth-child(2) {
    --wash-time: 9.6s;
    --pulse-time: 6.1s;
    --x-time: 14.4s;
    --turn-time: 21s;
}

.gallery-row .psy-frame:nth-child(1) {
    --wash-time: 5.9s;
    --pulse-time: 7.3s;
    --x-time: 8.8s;
    --turn-time: 24s;
}

.gallery-row .psy-frame:nth-child(2) {
    --wash-time: 12.8s;
    --pulse-time: 4.2s;
    --x-time: 16.6s;
    --turn-time: 15s;
}

.gallery-row .psy-frame:nth-child(3) {
    --wash-time: 8.1s;
    --pulse-time: 9.4s;
    --x-time: 12.1s;
    --turn-time: 27s;
}

.gallery-row .psy-frame:nth-child(4) {
    --wash-time: 10.7s;
    --pulse-time: 5.3s;
    --x-time: 18.2s;
    --turn-time: 17s;
}

/* Slightly quicker global color field. */
.psychedelic-mode::before {
    animation-duration: 8.5s;
}

@media (max-width: 800px) {
    /*
        Keep the SVG curves, but slightly lower overlay strength in small
        in-app browsers to reduce muddy clipping.
    */
    .psy-frame::before {
        opacity: min(0.78, calc(var(--wash-opacity, .62) + .10));
    }

    .psy-frame::after {
        opacity: min(0.68, calc(var(--x-opacity, .44) + .12));
    }
}


/*
    v10 — Warped photo backgrounds + unique per-image motion
    ---------------------------------------------------------
    Performance goals:
    - Remove canvas dependency from the visual experience
    - Reuse existing images as CSS backgrounds
    - Animate transforms and opacity only
    - Keep all motion automatic
*/

/* Hide the old canvas background; the warped photo layers replace it. */
#color-field {
    display: none;
}

/* Tone down the old generic background wash. */
.psychedelic-mode::before {
    opacity: .16;
    animation-duration: 18s;
}

/* Warped photo texture background */
.photo-backgrounds {
    position: fixed;
    inset: 0;
    z-index: -20;
    overflow: hidden;
    pointer-events: none;
    background: #050008;
}

.photo-bg {
    position: absolute;
    width: 72vmax;
    aspect-ratio: 4 / 5;
    background-size: cover;
    background-position: center;
    opacity: .17;
    mix-blend-mode: screen;
    filter: saturate(210%) contrast(115%) hue-rotate(var(--bg-hue, 0deg));
    transform-origin: center;
    will-change: transform, opacity, filter;
}

.photo-bg-1 {
    left: -27vmax;
    top: -14vmax;
    background-image: url("images/psy-sized/photo-1-1400.jpg");
    animation:
        bg-drift-1 34s ease-in-out infinite alternate,
        bg-hue-1 21s linear infinite,
        bg-pulse-1 11s ease-in-out infinite;
}

.photo-bg-2 {
    right: -30vmax;
    top: -5vmax;
    background-image: url("images/psy-sized/photo-2-1400.jpg");
    opacity: .12;
    animation:
        bg-drift-2 41s ease-in-out infinite alternate-reverse,
        bg-hue-2 29s linear infinite reverse,
        bg-pulse-2 14s ease-in-out infinite;
    animation-delay: -9s, -5s, -2s;
}

.photo-bg-3 {

    opacity: .15;
    animation:
        bg-drift-3 37s ease-in-out infinite alternate,

    animation-delay: -13s, -11s, -6s;
}

.photo-bg-4 {
    right: -18vmax;
    top: 40vh;
    background-image: url("images/psy-sized/photo-4-1400.jpg");
    width: 62vmax;
    opacity: .14;
    animation:
        bg-drift-4 46s ease-in-out infinite alternate-reverse,

.photo-bg-5 {

.photo-bg-6 {

/* RGB bleed using lightweight drop-shadows, different per image. */
.psy-frame img {
    transition: none;
}

.pattern-rings img {
    filter: url("#curve-acid") drop-shadow(10px 0 0 rgba(0, 235, 255, .28))
            drop-shadow(-10px 0 0 rgba(255, 0, 190, .24));
}

.pattern-waves img {
    filter: url("#curve-solar") drop-shadow(6px 0 0 rgba(0, 235, 255, .18))
            drop-shadow(-6px 0 0 rgba(255, 0, 190, .16));
}

.pattern-prisms img {
    filter: url("#curve-crushed") drop-shadow(12px 0 0 rgba(255, 0, 190, .28))
            drop-shadow(-8px 0 0 rgba(180, 255, 0, .20));
}

.pattern-kaleidoscope img {
    filter: url("#curve-inverted-midtones") drop-shadow(8px 0 0 rgba(0, 255, 220, .24))
            drop-shadow(-12px 0 0 rgba(255, 120, 0, .24));
}

.pattern-spiral img {
    filter: url("#curve-solar") drop-shadow(9px 0 0 rgba(120, 0, 255, .25))
            drop-shadow(-9px 0 0 rgba(0, 240, 255, .22));
}

.pattern-blobs img {
    filter: url("#curve-acid") drop-shadow(10px 0 0 rgba(255, 0, 110, .24))
            drop-shadow(-10px 0 0 rgba(180, 255, 0, .20));
}

/* Image 2 toned down so the subject remains readable. */
.pattern-waves::before {
    opacity: .42 !important;
    mix-blend-mode: color !important;
}

.pattern-waves::after {
    opacity: .25 !important;
    mix-blend-mode: screen !important;
}

.pattern-waves img {
    opacity: .98;
}

/* Distinct overlay personalities */
.pattern-rings::after {
    inset: -20%;
    opacity: .48;
    mix-blend-mode: screen;
    background:
        repeating-radial-gradient(
            circle at 50% 50%,
            rgba(255,0,190,.78) 0 3%,
            transparent 3% 8%,
            rgba(0,235,255,.62) 8% 11%,
            transparent 11% 17%
        );
    animation:
        rings-spin 18s linear infinite,
        rings-pulse 7s ease-in-out infinite alternate;
}

.pattern-waves::after {
    inset: -20%;
    background:
        repeating-linear-gradient(
            18deg,
            rgba(0,235,255,.42) 0 5%,
            transparent 5% 11%,
            rgba(255,0,190,.34) 11% 16%,
            transparent 16% 23%
        );
    animation:
        waves-slide 14s linear infinite,
        waves-shear 9s ease-in-out infinite alternate;
}

.pattern-prisms::after {
    inset: -28%;
    opacity: .50;
    mix-blend-mode: difference;
    background:
        conic-gradient(
            from 0deg,
            rgba(255,0,190,.88),
            rgba(0,235,255,.78),
            rgba(190,255,0,.72),
            rgba(255,120,0,.78),
            rgba(120,0,255,.82),

        );
    animation:
        prism-spin 22s linear infinite reverse,
        prism-scale 8s ease-in-out infinite alternate;

.pattern-kaleidoscope::after {
    inset: -34%;
    opacity: .44;
    mix-blend-mode: hard-light;
    background:
        repeating-conic-gradient(
            from 12deg,
            rgba(255,0,190,.74) 0 12deg,

            rgba(0,235,255,.66) 28deg 40deg,
            transparent 40deg 58deg
        );

        kaleido-spin 28s linear infinite,
        kaleido-breathe 10s ease-in-out infinite alternate;
}

.pattern-spiral::after {
    inset: -30%;
    opacity: .43;
    mix-blend-mode: screen;
    background:
        repeating-radial-gradient(
            ellipse at center,
            rgba(120,0,255,.70) 0 4%,

            rgba(0,235,255,.60) 9% 13%,
            transparent 13% 20%
        );
    animation:
        spiral-warp 19s ease-in-out infinite alternate,

}

.pattern-blobs::after {
    inset: -20%;
    opacity: .46;
    mix-blend-mode: color-dodge;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,0,190,.82), transparent 28%),
        radial-gradient(circle at 72% 22%, rgba(0,235,255,.76), transparent 31%),
        radial-gradient(circle at 52% 78%, rgba(190,255,0,.68), transparent 30%),
        radial-gradient(circle at 85% 70%, rgba(255,120,0,.68), transparent 29%);
    animation:
        blobs-wander 17s ease-in-out infinite alternate,
        blobs-color 13s linear infinite;
}

/* Background warp motion */
@keyframes bg-drift-1 {
    0%   { transform: translate3d(-6vw,-4vh,0) rotate(-18deg) scaleX(1.5) scaleY(.72); }
    100% { transform: translate3d(35vw,28vh,0) rotate(21deg) scaleX(.78) scaleY(1.48); }
}
@keyframes bg-drift-2 {
    0%   { transform: translate3d(8vw,-6vh,0) rotate(16deg) scaleX(.82) scaleY(1.55); }
    100% { transform: translate3d(-38vw,36vh,0) rotate(-24deg) scaleX(1.62) scaleY(.66); }
}
@keyframes bg-drift-3 {
    0%   { transform: translate3d(-12vw,2vh,0) rotate(-10deg) scaleX(1.3) scaleY(.86); }
    100% { transform: translate3d(27vw,-22vh,0) rotate(28deg) scaleX(.75) scaleY(1.42); }

    .gallery-row .psy-frame:nth-child(2)::before,

<script id="psychedelic-effects-v24-performance-script">
/* V24 performance-only runtime.
   Visual formulas and curve parameters are unchanged from V21.
   Work is limited to frames that are visible or about to enter the viewport.
*/
(function () {
    const NS = "http://www.w3.org/2000/svg";
    const SOLAR_INTERVAL_MS = 1000 / 15;
    const PRELOAD_MARGIN_PX = 160;
    const frameStates = new Map();
    const solarStates = { photo2: false, photo5: false };
    let solarTimer = 0;
    let solarRaf = 0;

    function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
    }

    function mix(a, b, t) {
        return a + (b - a) * t;
    }

    function ensureDefs() {
        let svg = document.getElementById("v21-solar-svg");
        if (svg) return svg.querySelector("defs");

        svg = document.createElementNS(NS, "svg");
        svg.setAttribute("id", "v21-solar-svg");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("width", "0");
        svg.setAttribute("height", "0");
        svg.style.position = "absolute";
        svg.style.overflow = "hidden";

        const defs = document.createElementNS(NS, "defs");
        svg.appendChild(defs);
        document.body.appendChild(svg);
        return defs;
    }

    function createAnimatedSolarFilter(id) {
        const defs = ensureDefs();
        if (document.getElementById(id)) {
            return {
                r: document.getElementById(id + "-r"),
                g: document.getElementById(id + "-g"),
                b: document.getElementById(id + "-b"),
                sat: document.getElementById(id + "-sat")
            };
        }

        const filter = document.createElementNS(NS, "filter");
        filter.setAttribute("id", id);
        filter.setAttribute("color-interpolation-filters", "sRGB");

        const comp = document.createElementNS(NS, "feComponentTransfer");
        const r = document.createElementNS(NS, "feFuncR");
        const g = document.createElementNS(NS, "feFuncG");
        const b = document.createElementNS(NS, "feFuncB");
        r.setAttribute("id", id + "-r");
        g.setAttribute("id", id + "-g");
        b.setAttribute("id", id + "-b");
        r.setAttribute("type", "table");
        g.setAttribute("type", "table");
        b.setAttribute("type", "table");
        comp.appendChild(r);
        comp.appendChild(g);
        comp.appendChild(b);

        const sat = document.createElementNS(NS, "feColorMatrix");
        sat.setAttribute("id", id + "-sat");
        sat.setAttribute("type", "saturate");
        sat.setAttribute("values", "1.65");

        filter.appendChild(comp);
        filter.appendChild(sat);
        defs.appendChild(filter);
        return { r, g, b, sat };
    }

    const photo2Filter = createAnimatedSolarFilter("curve-solar-photo2");
    const photo5Filter = createAnimatedSolarFilter("curve-solar-photo5");
    const photo2Frame = document.querySelector(".hero-pair .psy-frame:nth-child(2)");
    const photo5Frame = document.querySelector(".gallery-row .psy-frame:nth-child(3)");
    const photo2Img = photo2Frame && photo2Frame.querySelector("img");
    const photo5Img = photo5Frame && photo5Frame.querySelector("img");

    if (photo2Img) photo2Img.style.filter = 'url("#curve-solar-photo2")';
    if (photo5Img) photo5Img.style.filter = 'url("#curve-solar-photo5")';

    const baseR = [0.08, 0.95, 0.28, 1.00, 0.50, 0.82, 0.98];
    const baseG = [0.12, 0.30, 1.00, 0.35, 0.82, 0.22, 0.92];
    const baseB = [0.65, 0.18, 0.98, 0.28, 1.00, 0.44, 0.88];
    const invR = [0.96, 0.32, 0.88, 0.10, 0.78, 0.26, 0.08];
    const invG = [0.86, 0.18, 0.24, 0.92, 0.26, 0.98, 0.16];
    const invB = [0.18, 0.92, 0.20, 0.88, 0.22, 0.76, 0.14];

    const buffers = {
        p2r: new Float64Array(7), p2g: new Float64Array(7), p2b: new Float64Array(7),
        p5r: new Float64Array(7), p5g: new Float64Array(7), p5b: new Float64Array(7)
    };

    function modulateCurveInto(out, base, inv, t, phase, depth, crawl, wobble) {
        const invertBlend = (Math.sin(t * 0.00055 + phase) + 1) / 2;
        const expandBlend = (Math.sin(t * 0.00087 + phase * 1.7) + 1) / 2;
        const crawlBlend = (Math.sin(t * 0.00125 + phase * 2.4) + 1) / 2;
        const crawlOffset = Math.floor(crawlBlend * (base.length - 1));
        const center = (base.length - 1) / 2;

        for (let i = 0; i < base.length; i++) {
            const idxPhase = phase + i * crawl;
            const drift = Math.sin(t * 0.0014 + idxPhase) * depth;
            const ripple = Math.cos(t * 0.00096 + idxPhase * 1.4) * wobble;
            const expandedIndex = mix(i, center, expandBlend * 0.35);
            const neighborIndex = clamp(Math.round(expandedIndex), 0, base.length - 1);
            const expandedBase = mix(base[i], base[neighborIndex], expandBlend * 0.34);
            const inverted = mix(expandedBase, inv[i], invertBlend * 0.58);
            const crawled = mix(inverted, base[(i + crawlOffset) % base.length], 0.16);
            out[i] = clamp(crawled + drift + ripple, 0, 1);
        }
    }

    function formatTable(values) {
        let result = values[0].toFixed(3);
        for (let i = 1; i < values.length; i++) {
            result += " " + values[i].toFixed(3);
        }
        return result;
    }

    function setAttributeIfChanged(node, name, value) {
        if (node.getAttribute(name) !== value) node.setAttribute(name, value);
    }

    function updatePhoto2(now) {
        modulateCurveInto(buffers.p2r, baseR, invR, now, 0.2, 0.085, 0.48, 0.055);
        modulateCurveInto(buffers.p2g, baseG, invG, now, 1.6, 0.090, 0.54, 0.060);
        modulateCurveInto(buffers.p2b, baseB, invB, now, 2.8, 0.095, 0.60, 0.058);
        const saturation = (1.45 + ((Math.sin(now * 0.0011) + 1) / 2) * 0.55).toFixed(3);
        setAttributeIfChanged(photo2Filter.r, "tableValues", formatTable(buffers.p2r));
        setAttributeIfChanged(photo2Filter.g, "tableValues", formatTable(buffers.p2g));
        setAttributeIfChanged(photo2Filter.b, "tableValues", formatTable(buffers.p2b));
        setAttributeIfChanged(photo2Filter.sat, "values", saturation);
    }

    function updatePhoto5(now) {
        modulateCurveInto(buffers.p5r, baseR, invR, now, 0.9, 0.105, 0.62, 0.070);
        modulateCurveInto(buffers.p5g, baseG, invG, now, 2.2, 0.110, 0.70, 0.074);
        modulateCurveInto(buffers.p5b, baseB, invB, now, 3.5, 0.118, 0.78, 0.072);
        const saturation = (1.55 + ((Math.sin(now * 0.00133 + 1.4) + 1) / 2) * 0.62).toFixed(3);
        setAttributeIfChanged(photo5Filter.r, "tableValues", formatTable(buffers.p5r));
        setAttributeIfChanged(photo5Filter.g, "tableValues", formatTable(buffers.p5g));
        setAttributeIfChanged(photo5Filter.b, "tableValues", formatTable(buffers.p5b));
        setAttributeIfChanged(photo5Filter.sat, "values", saturation);
    }

    function solarIsNeeded() {
        return document.visibilityState === "visible" && (solarStates.photo2 || solarStates.photo5);
    }

    function stopSolarLoop() {
        if (solarTimer) clearTimeout(solarTimer);
        if (solarRaf) cancelAnimationFrame(solarRaf);
        solarTimer = 0;
        solarRaf = 0;
    }

    function scheduleSolarLoop() {
        if (!solarIsNeeded() || solarTimer || solarRaf) return;
        solarTimer = window.setTimeout(function () {
            solarTimer = 0;
            if (!solarIsNeeded()) return;
            solarRaf = requestAnimationFrame(solarStep);
        }, SOLAR_INTERVAL_MS);
    }

    function solarStep(now) {
        solarRaf = 0;
        if (!solarIsNeeded()) return;
        if (solarStates.photo2) updatePhoto2(now);
        if (solarStates.photo5) updatePhoto5(now);
        scheduleSolarLoop();
    }

    function updateSolarLoopState() {
        if (solarIsNeeded()) scheduleSolarLoop();
        else stopSolarLoop();
    }

    function setFrameState(frame, nearViewport) {
        if (!frame || frameStates.get(frame) === nearViewport) return;
        frameStates.set(frame, nearViewport);
        frame.classList.toggle("psy-offscreen", !nearViewport);
        if (frame === photo2Frame) solarStates.photo2 = nearViewport;
        if (frame === photo5Frame) solarStates.photo5 = nearViewport;
        updateSolarLoopState();
    }

    const frames = Array.from(document.querySelectorAll(".psy-frame"));
    if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver(function (entries) {
            for (const entry of entries) {
                setFrameState(entry.target, entry.isIntersecting);
            }
        }, {
            root: null,
            rootMargin: PRELOAD_MARGIN_PX + "px 0px " + PRELOAD_MARGIN_PX + "px 0px",
            threshold: 0
        });

        for (const frame of frames) {
            const rect = frame.getBoundingClientRect();
            const initiallyNear = rect.bottom >= -PRELOAD_MARGIN_PX && rect.top <= window.innerHeight + PRELOAD_MARGIN_PX;
            setFrameState(frame, initiallyNear);
            observer.observe(frame);
        }
    } else {
        for (const frame of frames) setFrameState(frame, true);
    }

    function handleVisibilityChange() {
        const hidden = document.visibilityState !== "visible";
        document.body.classList.toggle("psy-page-hidden", hidden);
        updateSolarLoopState();
    }

    document.addEventListener("visibilitychange", handleVisibilityChange, { passive: true });
    window.addEventListener("pagehide", stopSolarLoop, { passive: true });
    window.addEventListener("pageshow", updateSolarLoopState, { passive: true });
    handleVisibilityChange();
})();
</script>


<script id="v24-2-photo3-animation-script">
/* V24.2 — Photo 3 only
   Animate the crushed RGB mapping itself so the neon facial texture
   and posterized color layers crawl, expand, contract, and ripple.
*/
(function () {
    const NS = "http://www.w3.org/2000/svg";
    const INTERVAL_MS = 1000 / 12;
    const PRELOAD_MARGIN_PX = 160;

    function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
    }

    function mix(a, b, t) {
        return a + (b - a) * t;
    }

    function ensureDefs() {
        const svg = document.getElementById("v21-solar-svg");
        if (svg) return svg.querySelector("defs");
        return document.querySelector("svg defs");
    }

    function createAnimatedCrushedFilter(id) {
        const defs = ensureDefs();
        const existing = document.getElementById(id);
        if (existing) {
            return {
                r: document.getElementById(id + "-r"),
                g: document.getElementById(id + "-g"),
                b: document.getElementById(id + "-b"),
                sat: document.getElementById(id + "-sat")
            };
        }

        const filter = document.createElementNS(NS, "filter");
        filter.setAttribute("id", id);
        filter.setAttribute("color-interpolation-filters", "sRGB");

        const comp = document.createElementNS(NS, "feComponentTransfer");
        const r = document.createElementNS(NS, "feFuncR");
        const g = document.createElementNS(NS, "feFuncG");
        const b = document.createElementNS(NS, "feFuncB");
        r.setAttribute("id", id + "-r");
        g.setAttribute("id", id + "-g");
        b.setAttribute("id", id + "-b");
        r.setAttribute("type", "table");
        g.setAttribute("type", "table");
        b.setAttribute("type", "table");
        comp.appendChild(r);
        comp.appendChild(g);
        comp.appendChild(b);

        const sat = document.createElementNS(NS, "feColorMatrix");
        sat.setAttribute("id", id + "-sat");
        sat.setAttribute("type", "saturate");
        sat.setAttribute("values", "1.80");

        filter.appendChild(comp);
        filter.appendChild(sat);
        defs.appendChild(filter);
        return { r, g, b, sat };
    }

    const frame = document.querySelector('.gallery-row .psy-frame:nth-child(1)');
    const img = frame && frame.querySelector('img');
    if (!frame || !img) return;

    const filter = createAnimatedCrushedFilter('curve-crushed-photo3');

    const baseR = [0.02, 0.08, 0.90, 0.25, 1.00, 0.62];
    const baseG = [0.01, 0.70, 0.16, 0.96, 0.34, 0.88];
    const baseB = [0.18, 0.92, 0.08, 0.72, 1.00, 0.40];
    const altR  = [0.06, 0.22, 1.00, 0.10, 0.76, 0.94];
    const altG  = [0.10, 0.92, 0.06, 0.74, 1.00, 0.26];
    const altB  = [0.32, 1.00, 0.02, 0.88, 0.66, 0.12];

    const bufR = new Float64Array(6);
    const bufG = new Float64Array(6);
    const bufB = new Float64Array(6);
    let timer = 0;
    let raf = 0;
    let active = false;

    function formatTable(values) {
        let result = values[0].toFixed(3);
        for (let i = 1; i < values.length; i++) result += ' ' + values[i].toFixed(3);
        return result;
    }

    function setAttributeIfChanged(node, name, value) {
        if (node.getAttribute(name) !== value) node.setAttribute(name, value);
    }

    function modulateCrushedInto(out, base, alt, t, phase, driftAmp, rippleAmp) {
        const morph = (Math.sin(t * 0.00072 + phase) + 1) / 2;
        const crawl = (Math.sin(t * 0.00110 + phase * 1.8) + 1) / 2;
        const breathe = (Math.sin(t * 0.00165 + phase * 0.9) + 1) / 2;
        const offset = Math.floor(crawl * (base.length - 1));
        for (let i = 0; i < base.length; i++) {
            const p = phase + i * 0.73;
            const drift = Math.sin(t * 0.00155 + p) * driftAmp;
            const ripple = Math.cos(t * 0.00225 + p * 1.3) * rippleAmp;
            const morphed = mix(base[i], alt[i], morph * 0.50);
            const crawled = mix(morphed, alt[(i + offset) % base.length], 0.12 + breathe * 0.08);
            out[i] = clamp(crawled + drift + ripple, 0, 1);
        }
    }

    function step(now) {
        raf = 0;
        if (!active || document.visibilityState !== 'visible') return;

        modulateCrushedInto(bufR, baseR, altR, now, 0.2, 0.045, 0.032);
        modulateCrushedInto(bufG, baseG, altG, now, 1.4, 0.050, 0.036);
        modulateCrushedInto(bufB, baseB, altB, now, 2.6, 0.056, 0.040);
        const saturation = (1.34 + ((Math.sin(now * 0.00125 + 0.8) + 1) / 2) * 0.28).toFixed(3);

        setAttributeIfChanged(filter.r, 'tableValues', formatTable(bufR));
        setAttributeIfChanged(filter.g, 'tableValues', formatTable(bufG));
        setAttributeIfChanged(filter.b, 'tableValues', formatTable(bufB));
        setAttributeIfChanged(filter.sat, 'values', saturation);

        schedule();
    }

    function schedule() {
        if (!active || document.visibilityState !== 'visible' || timer || raf) return;
        timer = window.setTimeout(function () {
            timer = 0;
            if (!active || document.visibilityState !== 'visible') return;
            raf = requestAnimationFrame(step);
        }, INTERVAL_MS);
    }

    function stop() {
        if (timer) clearTimeout(timer);
        if (raf) cancelAnimationFrame(raf);
        timer = 0;
        raf = 0;
    }

    function updateState(nextActive) {
        if (active === nextActive) return;
        active = nextActive;
        if (active) schedule();
        else stop();
    }

    if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
            for (const entry of entries) {
                if (entry.target === frame) updateState(entry.isIntersecting);
            }
        }, {
            root: null,
            rootMargin: PRELOAD_MARGIN_PX + 'px 0px ' + PRELOAD_MARGIN_PX + 'px 0px',
            threshold: 0
        });

        const rect = frame.getBoundingClientRect();
        const initiallyNear = rect.bottom >= -PRELOAD_MARGIN_PX && rect.top <= window.innerHeight + PRELOAD_MARGIN_PX;
        updateState(initiallyNear);
        observer.observe(frame);
    } else {
        updateState(true);
    }

    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') schedule();
        else stop();
    }, { passive: true });
    window.addEventListener('pagehide', stop, { passive: true });
    window.addEventListener('pageshow', function () { if (active) schedule(); }, { passive: true });
})();
</script>
