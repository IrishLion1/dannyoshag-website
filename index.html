<script id="mode-switch-position-bootstrap">
(function () {
    try {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";

        const params = new URLSearchParams(location.search);
        if (params.get("modeSwitch") !== "1") return;

        window.__modeSwitchArrival = {
            anchor: params.get("modeAnchor") || "",
            progress: Number(params.get("modeProgress")),
            ratio: Number(params.get("modeRatio")),
            y: Number(params.get("modeY"))
        };
    } catch (_) {}
})();
</script>

<style id="mode-switch-direct-crossfade">
/* V24.2.11 — direct cross-document crossfade. */
@view-transition {
    navigation: auto;
}

::view-transition-group(root) {
    animation-duration: 560ms;
    animation-timing-function: cubic-bezier(.38, 0, .18, 1);
}

::view-transition-old(root) {
    animation: mode-switch-old-page 560ms cubic-bezier(.38, 0, .18, 1) both;
    mix-blend-mode: normal;
}

::view-transition-new(root) {
    animation: mode-switch-new-page 560ms cubic-bezier(.38, 0, .18, 1) both;
    mix-blend-mode: normal;
}

@keyframes mode-switch-old-page {
    from { opacity: 1; }
    to   { opacity: 0; }
}

@keyframes mode-switch-new-page {
    from { opacity: 0; }
    to   { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
    ::view-transition-group(root),
    ::view-transition-old(root),
    ::view-transition-new(root) {
        animation-duration: 1ms !important;
    }
}
</style>

<script id="mode-switch-direct-crossfade-runtime">
(function () {
    const PARAM_NAMES = [
        "modeSwitch",
        "modeAnchor",
        "modeProgress",
        "modeRatio",
        "modeY"
    ];

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    function maxScroll() {
        const root = document.documentElement;
        return Math.max(0, root.scrollHeight - window.innerHeight);
    }

    function capturePosition() {
        const viewportCenter = window.innerHeight / 2;
        const candidates = Array.from(document.querySelectorAll("[data-mode-anchor]"))
            .filter(function (element) {
                const rect = element.getBoundingClientRect();
                return rect.height > 0 && rect.bottom > 0 && rect.top < window.innerHeight;
            });

        let best = null;
        let bestDistance = Infinity;

        for (const element of candidates) {
            const rect = element.getBoundingClientRect();
            const elementCenter = rect.top + rect.height / 2;
            const distance = Math.abs(elementCenter - viewportCenter);
            if (distance < bestDistance) {
                best = { element: element, rect: rect };
                bestDistance = distance;
            }
        }

        const maximum = maxScroll();
        const state = {
            anchor: "",
            progress: 0.5,
            ratio: maximum > 0 ? window.scrollY / maximum : 0,
            y: window.scrollY
        };

        if (best) {
            state.anchor = best.element.getAttribute("data-mode-anchor") || "";
            state.progress = clamp((viewportCenter - best.rect.top) / best.rect.height, 0, 1);
        }

        return state;
    }

    function targetScrollFor(state) {
        const maximum = maxScroll();

        if (state && state.anchor) {
            const target = Array.from(document.querySelectorAll("[data-mode-anchor]")).find(function (element) {
                return element.getAttribute("data-mode-anchor") === state.anchor;
            });
            if (target) {
                const rect = target.getBoundingClientRect();
                if (rect.height > 0) {
                    const progress = Number.isFinite(state.progress) ? clamp(state.progress, 0, 1) : 0.5;
                    const absoluteTop = window.scrollY + rect.top;
                    return clamp(absoluteTop + rect.height * progress - window.innerHeight / 2, 0, maximum);
                }
            }
        }

        if (state && Number.isFinite(state.ratio)) {
            return clamp(state.ratio, 0, 1) * maximum;
        }

        return state && Number.isFinite(state.y) ? clamp(state.y, 0, maximum) : 0;
    }

    const arrival = window.__modeSwitchArrival || null;

    function restorePosition() {
        if (!arrival) return;
        window.scrollTo({ top: targetScrollFor(arrival), left: 0, behavior: "auto" });
    }

    function cleanTransitionParameters() {
        if (!arrival) return;
        try {
            const cleanUrl = new URL(location.href);
            for (const name of PARAM_NAMES) cleanUrl.searchParams.delete(name);
            history.replaceState(history.state, "", cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
        } catch (_) {}
    }

    if (arrival) {
        const restoreDelays = [0, 30, 90, 180, 360, 700, 1100, 1700];
        for (const delay of restoreDelays) {
            window.setTimeout(restorePosition, delay);
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", restorePosition, { once: true });
        } else {
            restorePosition();
        }

        window.addEventListener("load", restorePosition, { once: true, passive: true });
        window.addEventListener("pageshow", restorePosition, { once: true, passive: true });

        const imageDecodes = Array.from(document.images).map(function (image) {
            if (typeof image.decode !== "function") return Promise.resolve();
            return image.decode().catch(function () {});
        });
        Promise.allSettled(imageDecodes).then(restorePosition);

        window.setTimeout(cleanTransitionParameters, 1900);
    }

    const switchLink = document.querySelector("a.mode-switch[href]");
    if (!switchLink) return;

    switchLink.addEventListener("click", function (event) {
        if (
            event.defaultPrevented ||
            event.button !== 0 ||
            event.metaKey ||
            event.ctrlKey ||
            event.shiftKey ||
            event.altKey
        ) return;

        const destination = new URL(switchLink.href, location.href);
        if (destination.origin !== location.origin) return;

        event.preventDefault();

        const position = capturePosition();
        destination.searchParams.set("modeSwitch", "1");
        destination.searchParams.set("modeAnchor", position.anchor);
        destination.searchParams.set("modeProgress", position.progress.toFixed(6));
        destination.searchParams.set("modeRatio", position.ratio.toFixed(8));
        destination.searchParams.set("modeY", Math.round(position.y).toString());

        location.assign(destination.href);
    });
})();
</script>
