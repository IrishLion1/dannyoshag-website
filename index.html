<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>

<link href="favicon.svg" rel="icon" type="image/svg+xml"/>
<style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            margin: 0;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            padding-left: 24px;
            padding-right: 24px;
            text-align: center;
        }

        main {
            width: 100%;
        }

        .hero-pair,
        .gallery-row {
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            padding-left: 24px;
            padding-right: 24px;
        }

        .hero-pair {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            max-width: 1148px;
            margin-bottom: 18px;
        }

        .gallery-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            max-width: 1248px;
        }

        .hero-pair img,
        .gallery-row img {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            margin: 0 auto;
        }

        .contact {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 64px 24px 72px;
            text-align: center;
        }

        .contact h2,
        .contact p {
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        .contact a {
            color: inherit;
            overflow-wrap: anywhere;
        }

        @media (max-width: 800px) {
            header {
                padding-top: 36px;
                padding-bottom: 32px;
            }

            header h1 {
                font-size: clamp(2rem, 10vw, 3rem);
            }

            .hero-pair,
            .gallery-row {
                grid-template-columns: 1fr;
                gap: 16px;
                max-width: 560px;
                padding-left: 16px;
                padding-right: 16px;
            }

            .hero-pair {
                margin-bottom: 16px;
            }

            .contact {
                padding: 48px 16px 64px;
            }
        }
    
.back-home{

padding:8px 12px;
background:rgba(0,0,0,.65);

border:1px solid rgba(255,255,255,.25);
border-radius:999px;
font:600 12px Arial,sans-serif;
backdrop-filter:blur(6px);
z-index:9999;
}
.back-home:hover{background:rgba(255,255,255,.12);}

</style>
</head>
